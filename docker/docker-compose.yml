# For a Linux host / Raspberry Pi. Run from this folder: docker compose up -d --build
services:
  printbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: printbox
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      - TZ=America/New_York
      - INBOX_DIR=/inbox
    volumes:
      # Point this at the locally synced Google Drive PrintBox folder (e.g. via rclone)
      - ${PRINTBOX_HOST_DIR:-/srv/printbox}:/inbox
